default:
  image: docker:29.0
  services:
    - docker:29.0-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin

stages:
  - build
  - test
  - release
  - deploy

variables:
  # Use TLS https://docs.gitlab.com/ee/ci/docker/using_docker_build.html#tls-enabled
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  CONTAINER_FRONTEND_IMAGE: $CI_REGISTRY_IMAGE:frontend_$CI_COMMIT_REF_SLUG
  CONTAINER_BACKEND_IMAGE: $CI_REGISTRY_IMAGE:backend_$CI_COMMIT_REF_SLUG

build-frontend:
  stage: build
  script:
    - docker build --build-arg BUILDKIT_INLINE_CACHE=1 --cache-from $CONTAINER_FRONTEND_IMAGE --pull -t $CONTAINER_FRONTEND_IMAGE ./frontend
    - docker push $CONTAINER_FRONTEND_IMAGE

build-backend:
  stage: build
  script:
    - docker build --build-arg BUILDKIT_INLINE_CACHE=1 --cache-from $CONTAINER_BACKEND_IMAGE --pull -t $CONTAINER_BACKEND_IMAGE ./backend
    - docker push $CONTAINER_BACKEND_IMAGE

# Tests run without docker: they override the default image, services and docker login.
# `needs: []` starts them right away instead of after the build stage.
test-backend:
  stage: test
  needs: []
  image: ghcr.io/astral-sh/uv:0.13-python3.13-bookworm
  services: []
  before_script: []
  variables:
    UV_CACHE_DIR: $CI_PROJECT_DIR/.uv-cache
    UV_LINK_MODE: copy
    UV_PYTHON_DOWNLOADS: never
    UV_PROJECT_ENVIRONMENT: $CI_PROJECT_DIR/backend/.venv
    # llama-cpp-python has no wheel on PyPI: CPU build (cached as a wheel in UV_CACHE_DIR)
    CMAKE_ARGS: "-DGGML_NATIVE=off -DGGML_CUDA=off -DLLAVA_BUILD=off"
    HF_HUB_OFFLINE: "1"
  cache:
    key:
      files:
        - backend/uv.lock
    paths:
      - .uv-cache
  script:
    - cd backend
    # no `cuda` extra (cudf/cuml); the dev group (pytest, fakeredis) is synced by default
    - uv sync --frozen
    - uv run --frozen pytest -q --junitxml=report.xml
  after_script:
    - uv cache prune --ci --cache-dir "$CI_PROJECT_DIR/.uv-cache" || true
  artifacts:
    when: always
    reports:
      junit: backend/report.xml

test-frontend:
  stage: test
  needs: []
  image: node:26-alpine
  services: []
  before_script: []
  cache:
    key:
      files:
        - frontend/package.json
    paths:
      - .npm
  script:
    - cd frontend
    # no package-lock.json (bun.lock is tracked): install like the Dockerfile does
    - npm install --cache "$CI_PROJECT_DIR/.npm" --prefer-offline --no-audit --no-fund
    - npm run type-check

